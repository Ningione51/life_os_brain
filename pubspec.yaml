name: life_os_brain
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.14.0-211.1.beta

dependencies:
  flutter:
    sdk: flutter

  # Archiviazione Sicura Chiavi DB
  flutter_secure_storage: ^9.2.2

  # ML Kit Packages (allineati)
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_image_labeling: ^0.14.0

  # Trascrizione Vocale
  speech_to_text: ^7.0.0

  # Altre dipendenze
  flutter_speed_dial: ^7.0.0
  audioplayers: ^6.0.0
  record: 5.2.1
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  sqflite_sqlcipher: ^3.1.0+1
  flutter_riverpod: ^2.5.1

dependency_overrides:
  record_platform_interface: 1.2.0

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icon.png"
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
